      margin: 10px 50px 10px 200px;

      border-width: 5px;
      border-color:#09729b;
      border-radius: 20%;

      margin: auto;
      height: 100%;

      font-family:'Times New Roman', Times, serif;
      margin: -5px 60px 5px 5px;
      border-style: solid;
      border-width: 5px;
      border-color:#09729b;
      border-radius: 3%;
      max-width:100%;
    }

    .container>div.footer {
      grid-area: footer;
    }

li a {

   border-style: solid;
  border-width: 2px;
  border-color:#09729b;
  border-radius: .5%;
}

li a.active {
  background-color: #88a4a7;
  color: white;
  border-bottom: 1px solid #ffffff;
   border-style: solid;
  border-width: 1px;
  border-color:#09729b;
  border-radius: .5%;
}

li:last-child {

}
li a:hover:not(.active) {

  color: white;
}
